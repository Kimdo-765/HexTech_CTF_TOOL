name: hextech_ctf_tool

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Grok binary for live monitor narration (and Settings auth status).
      PATH: /root/.grok/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      GROK_HOME: /root/.grok
      # Lift the SDK's per-turn output cap. The model still has its
      # own hard ceiling (Sonnet/Opus ~64k), so the agent picks
      # whatever its model supports rather than getting truncated
      # at the SDK default. Override in .env if you want it lower.
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${CLAUDE_CODE_MAX_OUTPUT_TOKENS:-999999}
      # SDK 0.2.x connects MCP servers in the background by default (slow ones
      # report status=pending until ready). Our in-process `team` spawn_subagent
      # server must be live before turn 1, so restore the pre-0.2.82 synchronous
      # connect. memory: sdk_bundled_cli_thinking_400.
      MCP_CONNECTION_NONBLOCKING: "0"
    volumes:
      - ./data:/data
      - ./modules:/app/modules:ro
      - ./web-ui:/app/web-ui:ro
      # Mount the api source so code changes (especially api/routes/*) take
      # effect on `docker compose restart api` without rebuilding the image.
      # Worker already mounts ./modules the same way. Concrete incident
      # 2026-05-17: `_carry_work_ignore` patch in api/routes/retry.py did
      # NOT propagate because api was image-baked; retries that copied a
      # rootfs (with dev/console chr device) hung copytree indefinitely.
      - ./api:/app/api:ro
      # rw (not ro) so /retry and /resume can copy the previous SDK
      # session's transcript jsonl into the new job's project-key
      # directory under ~/.claude/projects/. Without this the SDK
      # CLI transport searches only the new cwd's project key and
      # can't find the prior session, so fork_session silently fails.
      - ${HOST_CLAUDE_HOME:-${HOME}/.claude}:/root/.claude
      # Grok auth for Settings status + future Grok-driven jobs.
      - ${HOST_GROK_HOME:-${HOME}/.grok}:/root/.grok
      # api needs the docker socket to kill sibling containers spawned by
      # workers when the user deletes a running job.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    # Cgroup memory cap — RESTORED 2026-07-29 for a DIFFERENT reason than the
    # one that was rolled back.
    #
    # History: earlier images set mem_limit/memswap_limit believing long
    # heap-pwn runs died of cumulative-heap OOM hits. A May 2026 forensic pass
    # showed every "exit code -9" there was the debugger subagent self-pkilling
    # via `pkill -f "./prob"` (the SDK passes system_prompt as CLI argv, so the
    # regex matched the agent's own claude CLI). That fratricide is fixed in
    # the prompt, and the cap was removed as defending a phantom.
    #
    # The phantom was real, but "there is no real OOM" was too strong. On
    # 2026-07-29 the WSL VM FROZE and had to be power-cycled by hand. The
    # kernel journal of the dead boot is unambiguous — four `global_oom` kills
    # inside THIS container, all python3:
    #     Out of memory: Killed process 4668 (python3) anon-rss:14980088kB
    # i.e. one process holding 15.0 GB inside a 15.5 GB VM. These are kernel
    # OOM kills with real RSS, not exit -9. After the last one the VM never
    # recovered: from 05:52:40 it could not allocate even order-0 pages for 9p
    # reads of /mnt/c, and took 2m18s to print a single stack trace. That is
    # the freeze.
    #
    # So the cap's purpose is NOT to prevent a job dying — a runaway job is
    # killed either way. It is to make the kill LOCAL: without a cgroup bound,
    # one uncapped container competes with the whole VM (and up to
    # WORKER_CONCURRENCY=3 of its own jobs), and the OOM killer's collateral is
    # the host session. 12g leaves headroom under the 16 GB VM for the kernel,
    # dockerd, api and redis.
    #
    # memswap_limit == mem_limit deliberately: with mem_limit alone Docker
    # allows swap up to 2x the cap, and slow swap thrash is precisely the state
    # that wedged the VM. Equal values mean the container gets a fast, clean
    # kill instead of dragging everything down with it.
    #
    # This value is the BOOT default only. It is a container-CREATE property,
    # so a recreate (`docker compose up -d worker`) is what applies it —
    # `deploy.sh --changed` only restarts and will NOT. To change it WITHOUT a
    # recreate use Settings → "Worker memory limit" in the UI, which pushes the
    # new cap onto the live cgroup via the Docker API and shows the value the
    # container actually has. Set WORKER_MEM_LIMIT in .env to change what a
    # recreate comes back with.
    mem_limit: ${WORKER_MEM_LIMIT:-12g}
    memswap_limit: ${WORKER_MEM_LIMIT:-12g}
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      HOST_DATA_DIR: ${HOST_DATA_DIR:-./data}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      # Grok Build binary lives under the mounted ~/.grok tree.
      PATH: /root/.grok/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      GROK_HOME: /root/.grok
      # Default cap the docker shim injects into an agent-started container
      # that omits --memory (worker/docker_memguard.sh). Empty or 0 disables.
      CHAL_CONTAINER_MEM: ${CHAL_CONTAINER_MEM:-2g}
      # Tell the bundled `claude` CLI it is running in a sandbox so it allows
      # --dangerously-skip-permissions even though the container runs as root.
      IS_SANDBOX: "1"
      # Lift the SDK's per-turn output cap. The model's own ceiling
      # (Sonnet/Opus ~64k) becomes the effective limit. Override in
      # .env to throttle if needed.
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${CLAUDE_CODE_MAX_OUTPUT_TOKENS:-999999}
      # Restore pre-0.2.82 synchronous MCP connect so the in-process `team`
      # spawn_subagent server is ready before main's turn 1 (SDK 0.2.x defaults
      # to background connect). memory: sdk_bundled_cli_thinking_400.
      MCP_CONNECTION_NONBLOCKING: "0"
      # Trip-wire: at this many tool calls without an artifact, the
      # orchestrator FALLS BACK to a probe-only skeleton at exploit.py
      # so the sandbox + postjudge path still runs (job ends as
      # no_flag/partial instead of failed). Default raised 100 → 150
      # after jobs d8de/0bb1/13a3 hit budget cleanly but never produced
      # an artifact even after FINAL_DRAFT push; the higher cap gives
      # Sonnet-4.6 enough rope to land a real draft while the fallback
      # path guarantees the run never aborts. A soft eject + scaffold
      # nudge fire well before the cap; the fallback is the safety net.
      INVESTIGATION_BUDGET: ${INVESTIGATION_BUDGET:-150}
      # Max postjudge-driven auto retries within a single job (in
      # addition to the first attempt). When auto_run is on and the
      # sandbox returns a non-success verdict with an actionable
      # retry_hint, the orchestrator injects that hint as a new user
      # turn back to the same main SDK session, preserving cache.
      # Semantics:
      #   0                    → disabled (legacy fire-and-forget)
      #   N (positive int)     → cap at exactly N retries
      #   -1 / inf / unlimited → no cap; loop continues until success,
      #     empty retry_hint, agent error, BUDGET_ABORT, user Stop, or
      #     soft/hard timeout
      # Default: -1 (unlimited). Override via .env if you want a cap.
      AUTO_RETRY_MAX: ${AUTO_RETRY_MAX:--1}
    volumes:
      - ./data:/data
      - ./modules:/app/modules:ro
      # Mount the worker source so changes to worker/runner.py
      # (e.g. _sweep_stale_tmp, RQ wiring) take effect on `restart
      # worker` without rebuilding. Same rationale as api's
      # ./api:/app/api:ro mount.
      - ./worker:/app/worker:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the host's Claude Code config so the bundled `claude` CLI in the
      # worker uses your existing claude.ai OAuth token (no API key needed).
      # Run `claude login` once on the host to populate ~/.claude/.
      - ${HOST_CLAUDE_HOME:-${HOME}/.claude}:/root/.claude
      # Optional Grok Build auth (agent_provider=grok). Run `grok login` on the
      # host; set HOST_GROK_HOME if ~/.grok lives elsewhere. Not required when
      # using XAI_API_KEY / Settings xai_api_key instead.
      - ${HOST_GROK_HOME:-${HOME}/.grok}:/root/.grok
    # Targeted seccomp profile so gdb/dynamic-analysis in the rev `debugger`
    # subagent can disable ASLR. gdb turns off per-inferior randomization via
    # personality(ADDR_NO_RANDOMIZE = 0x40000), which the DEFAULT Docker seccomp
    # profile rejects with EPERM. Concrete cost (job c70160244e53, rev
    # "damnida"): gdb printed `Error disabling address space randomization:
    # Operation not permitted`, the stack pointer moved run-to-run, the gdb
    # per-gate oracle was unreadable, and the solve had to pivot to a
    # from-scratch fixed-base Unicorn emulation (~1h43 extra). The profile is
    # the Docker default PLUS exactly that one personality() value (see
    # modules/seccomp_gdb_aslr.json). It REPLACES an earlier seccomp=unconfined
    # (f829f4b): an adversarial test showed unconfined needlessly re-exposed
    # unprivileged user namespaces / keyctl / bpf. Path is relative to this
    # compose file; Compose reads the file and sends its content to the daemon.
    # (This worker also mounts docker.sock rw, which already dominates any
    # seccomp consideration here — the profile is defense-in-depth + parity
    # with the runner, which is the container where isolation actually matters.)
    security_opt:
      - seccomp=./modules/seccomp_gdb_aslr.json
    depends_on:
      - redis
    restart: unless-stopped

  # Built but not started by default. Worker spawns transient instances per job.
  decompiler:
    image: hextech_ctf_tool-decompiler
    build:
      context: .
      dockerfile: decompiler/Dockerfile
      args:
        GHIDRA_VERSION: ${GHIDRA_VERSION:-12.0.4}
        GHIDRA_BUILD_DATE: ${GHIDRA_BUILD_DATE:-20260303}
    profiles: ["tools"]

  forensic:
    image: hextech_ctf_tool-forensic
    build:
      context: .
      dockerfile: forensic/Dockerfile
    profiles: ["tools"]

  misc:
    image: hextech_ctf_tool-misc
    build:
      context: .
      dockerfile: misc/Dockerfile
    profiles: ["tools"]

  runner:
    image: hextech_ctf_tool-runner
    build:
      context: .
      dockerfile: runner/Dockerfile
    profiles: ["tools"]

  sage:
    image: sagemath/sagemath:latest
    profiles: ["tools-sage"]

volumes:
  redis-data:
